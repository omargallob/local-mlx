name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel (with caching)
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Test (nogo runs inside the build)
        run: bazel test //...

      - name: Lint BUILD files (buildifier)
        run: bazel run //:buildifier.check

      - name: Check BUILD files are up to date (gazelle)
        run: bazel run //:gazelle -- -mode=diff
