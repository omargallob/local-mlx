name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-amd64
            runner: macos-13
          - name: macos-arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel (with caching)
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # golangci-lint typechecks with the host Go toolchain; match go.mod.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (nogo runs inside the build)
        run: bazel test //...

      - name: Lint Go (golangci-lint via Bazel)
        run: bazel run //tools/lint:golangci-lint -- run

      # BUILD-file checks are host-agnostic; run once on linux/amd64.
      - name: Lint BUILD files (buildifier)
        if: matrix.name == 'linux-amd64'
        run: bazel run //:buildifier.check

      - name: Check BUILD files are up to date (gazelle)
        if: matrix.name == 'linux-amd64'
        run: bazel run //:gazelle -- -mode=diff
